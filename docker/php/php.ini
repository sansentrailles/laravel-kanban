[PHP]
; =============================================================================
; ОБЩИЕ НАСТРОЙКИ
; =============================================================================
engine = On
short_open_tag = Off
precision = 14
output_buffering = 4096
zlib.output_compression = Off
implicit_flush = Off
serialize_precision = -1
disable_functions =
disable_classes =
zend.enable_gc = On
expose_php = Off

; =============================================================================
; ВРЕМЕННЫЕ ЛИМИТЫ
; =============================================================================
max_execution_time = 300          ; 5 минут - для обработки больших изображений
max_input_time = 300
max_input_nesting_level = 64
max_input_vars = 5000

; =============================================================================
; ПАМЯТЬ (ВАЖНО ДЛЯ IMAGICK!)
; =============================================================================
; ImageMagick потребляет много памяти при обработке изображений
memory_limit = 512M

; =============================================================================
; ОБРАБОТКА ОШИБОК
; =============================================================================
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
display_startup_errors = Off
log_errors = On
log_errors_max_len = 1024
error_log = /var/log/php/error.log
report_memleaks = On

; =============================================================================
; ЗАГРУЗКА ФАЙЛОВ (ВАЖНО ДЛЯ ИЗОБРАЖЕНИЙ!)
; =============================================================================
file_uploads = On
upload_tmp_dir = /tmp
upload_max_filesize = 64M         ; Максимальный размер загружаемого файла
post_max_size = 64M               ; Максимальный размер POST-запроса
max_file_uploads = 20

; =============================================================================
; НАСТРОЙКИ IMAGICK
; =============================================================================
; Фикс для проблем с локалью в некоторых системах
imagick.locale_fix = 1

; Включить монитор прогресса (полезно для отладки)
; imagick.progress_monitor = 0

; =============================================================================
; DATE/TIMEZONE
; =============================================================================
date.timezone = UTC

; =============================================================================
; OPCACHE (для production)
; =============================================================================
[opcache]
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.save_comments = 1

; =============================================================================
; REALPATH CACHE
; =============================================================================
[realpath_cache]
realpath_cache_size = 4096k
realpath_cache_ttl = 600
